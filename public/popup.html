<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" /> 
    <title>Clip Manager Dashboard</title>
    <link rel="stylesheet" href="popup.css" />
    <link rel="icon" href="icon.png" type="image/png">
</head>
<body>
    
    <div id="auth-view" style="display: none;">
        <p>Per favore, accedi a Twitch per continuare.</p>
        <button id="login-button">Accedi con Twitch</button>
    </div>

    <div id="main-view">
        
        <header id="streamer-header">
            
            <div id="streamer-profile">
                <img id="streamer-icon" src="icon.png" alt="Icona Streamer" />
                <div id="streamer-info">
                    <h2 id="streamer-name">Caricamento...</h2>
                    <p id="stream-title">Caricamento...</p>
                </div>
            </div>

            <div id="live-status-container">
                <span id="streamer-viewers" class="text-xs">--</span>
                <span class="live-dot">●</span> 
                <span>LIVE</span>
            </div>
            
            <div id="header-left">
                <h1 id="app-title"></h1> </div>
            
            <button id="logout-button" title="Logout">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            </button>
        </header>

        <main id="content-wrapper">
            
            <section id="clips-section">
                <div class="section-header">
                    <h2 class="section-title">
                        🎬 Sezione Clip
                    </h2>
                </div>
                <div id="clips-container">
                    <div id="status-message" class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                        <h3>Caricamento...</h3>
                        <p>Caricamento dati API...</p>
                    </div>
                </div>
            </section>

            <aside id="chat-log-section">
                <div class="section-header">
                    <h2 class="section-title">
                        💬 Log Entrata/Uscita
                    </h2>
                </div>
                <div id="chat-log-content">
                    <ul id="chat-log-list">
                        <li class="log-header">Avvio Log...</li>
                        <li><span class="log-entry-main">In attesa di dati API...</span></li>
                    </ul>
                </div>
            </aside>

        </main>
    </div>

    <div id="ban-modal" style="display: none;">
        <div class="modal-content">
            <h3>Banna Utente</h3>
            <p>Stai per bannare: <strong id="ban-username">...</strong></p>
            <div class="form-group">
                <label for="ban-duration">Durata (secondi):</label>
                <input type="number" id="ban-duration" value="300">
            </div>
            <div class="form-group">
                <label for="ban-reason">Motivo (opzionale):</label>
                <input type="text" id="ban-reason" placeholder="Nessun motivo">
            </div>
            <div class="modal-actions">
                <button id="cancel-ban" class="btn-secondary">Annulla</button>
                <button id="confirm-ban" class="btn-danger">Conferma Ban</button>
            </div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
